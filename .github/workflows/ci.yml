# Continuous integration.
#
# Runs on every push and pull request. The build machine has network access;
# the application it tests does not use any at runtime, and
# tests/test_offline_egress.py fails the build if a reference to an external
# host appears.
#
# Model weights are not available here (they cannot live in git), so tests that
# need them skip. The golden-dataset evaluation needs the models and a language
# model, so it is run on a machine that has them, not in CI.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1

      - name: Install torch (CPU, pinned to whisperx's supported range)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          printf "torch==2.8.0\ntorchaudio==2.8.0\n" > constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install -c constraints.txt --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          python -m pip install -c constraints.txt -r requirements-dev.txt
          python -m pip check

      - name: Lint for runtime defects
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npx vitest run
